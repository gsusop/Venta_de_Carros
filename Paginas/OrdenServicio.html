<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ORDEN SERVICIO</title>
    <!-- Google Font: Source Sans Pro -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link href="Estilos/css/all.min.css" rel="stylesheet" />
    <link href="Estilos/adminlte.min.css" rel="stylesheet" />
    <!--Estilos para las tablas-->
    <link href="Estilos/dataTables.min.css" rel="stylesheet" />
    <link href="Estilos/dataTables.bootstrap4.min.css" rel="stylesheet" />
</head>
<style>
    #tblOrdenServicio_length > label > select {
        width: 60px;
    }
</style>
<body class="hold-transition sidebar-mini">
    <section class="content">
        <div class="container-fluid">
            <div class="row">
                <!-- left column -->
                <div class="col-md-12" id="dvMenu">
                </div>
                <div class="col-md-12">
                    <div class="card card-primary">
                        <div class="card-header">
                            <h3 class="card-title">GESTIÓN DE ORDEN SERVICIO</h3>
                        </div>
                        <form id="frmIncapacidades">
                            <div class="card-body">
                                <div class="card card-gray-dark">
                                    <div class="card-header">
                                        <h3 class="card-title">DATOS ENTRADA</h3>
                                    </div>
                                    <div class="card-body">

                                        <div class="row">

                                            <!-- CAMPO OCULTO PARA ID_VENTA -->
                                            <!-- <input type="hidden" id="txtID_Venta" /> -->

                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtID_Orden">Codigo Orden</label>
                                                    <input type="text" class="form-control" id="txtID_Orden" placeholder="Id orden">
                                                </div>
                                            </div>



                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtNumero_Orden">Codigo de Orden</label>
                                                    <input type="text" class="form-control" id="txtNumero_Orden" placeholder="(CODIGO UNICO)">
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtID_Vehiculo">Codigo Vehiculo</label>
                                                    <input type="text" class="form-control" id="txtID_Vehiculo" placeholder="Id del vehiculo">
                                                </div>
                                            </div>

                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtFecha_Creacion"> Fecha creacion </label>
                                                    <input type="date" class="form-control" id="txtFecha_Creacion" placeholder="Fecha creacion" step="0.01">
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtFecha_Inicio"> Fecha Inicio </label>
                                                    <input type="date" class="form-control" id="txtFecha_Inicio" placeholder="Fecha Inicio" step="0.01">
                                                </div>
                                            </div>

                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtFecha_Fin_Estimada"> Fecha Estimada Fin </label>
                                                    <input type="date" class="form-control" id="txtFecha_Fin_Estimada" placeholder="Fecha Estimada Fin" step="0.01">
                                                </div>
                                            </div>

                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtFecha_Fin_Real"> Fecha Finalizacion </label>
                                                    <input type="date" class="form-control" id="txtFecha_Fin_Real" placeholder="Fecha Finalizacion" step="0.01">
                                                </div>
                                            </div>






                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtID_Empleado_Asignado"> Codigo empleado asignado</label>
                                                    <input type="text" class="form-control" id="txtID_Empleado_Asignado" placeholder="Id empleado asignado " step="0.01">
                                                </div>
                                            </div>

                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtEstado_Orden"> Estado Orden</label>
                                                    <input type="text" class="form-control" id="txtEstado_Orden" placeholder="Estado de la orden" step="0.01">
                                                </div>
                                            </div>

                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtDiagnostico_Inicial"> Diagnostico Inicial</label>
                                                    <input type="text" class="form-control" id="txtDiagnostico_Inicial" placeholder="Diagnostico Inicial" step="0.01">
                                                </div>
                                            </div>

                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtComentarios_Adicionales"> Comentarios</label>
                                                    <input type="text" class="form-control" id="txtComentarios_Adicionales" placeholder="Comentarios" step="0.01">
                                                </div>
                                            </div>

                                        </div>

                                    </div>
                                </div>
                                <div class="card card-danger">
                                    <div class="card-header">
                                        <h3 class="card-title">PROCESO</h3>
                                    </div>
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-md-3">
                                                <br />
                                                <button type="button" id="btnInsertar" class="btn-block btn-lg btn-primary" onclick="EjecutarComando('POST', 'Insertar')">INSERTAR</button>
                                            </div>
                                            <div class="col-md-3">
                                                <br />
                                                <button type="button" id="btnActualizar" class="btn-block btn-lg btn-primary" onclick="EjecutarComando('PUT', 'Actualizar')">ACTUALIZAR</button>
                                            </div>
                                            <div class="col-md-3">
                                                <br />
                                                <button type="button" id="btnEliminar" class="btn-block btn-lg btn-primary" onclick="EjecutarComando('DELETE', 'Eliminar')">ELIMINAR</button>
                                            </div>
                                            <div class="col-md-3">
                                                <br />
                                                <button type="button" id="btnConsultar" class="btn-block btn-lg btn-primary" onclick="Consultar()">CONSULTAR</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-12">
                                            <table id="tblOrdenServicio" class="table table-bordered table-striped" style="width:100%;">
                                                <thead>
                                                    <tr>
                                                        <th>ID_Orden</th>
                                                        <th>Numero_Orden</th>
                                                        <th>ID_Vehiculo</th>
                                                        <th>Fecha_Creacion</th>
                                                        <th>Fecha_Inicio</th>
                                                        <th>Fecha_Fin_Estimada</th>
                                                        <th>Fecha_Fin_Real</th>
                                                        <th>ID_Empleado_Asignado</th>
                                                        <th>Estado_Orden</th>
                                                        <th>Diagnostico_Inicial</th>
                                                        <th>Comentarios_Adicionales</th>

                                                    </tr>
                                                </thead>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="card-footer">
                                <div id="dvMensaje" class=""></div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="../Scripts/jquery-3.4.1.min.js"></script>
    <script src="../Scripts/bootstrap.bundle.min.js"></script>
    <!--Tables-->
    <script src="../Scripts/jquery.dataTables.min.js"></script>
    <script src="../Scripts/dataTables.bootstrap4.min.js"></script>
    <script src="Scripts/Comunes/Comunes.js"></script>
    <script src="Scripts/Comunes/CRUD.js"></script>
    <script src="Scripts/OrdenServicio.js"></script>
</body>
</html>
