<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DETALLE FACTURA</title>
    <!-- Google Font: Source Sans Pro -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link href="Estilos/css/all.min.css" rel="stylesheet" />
    <link href="Estilos/adminlte.min.css" rel="stylesheet" />
    <!--Estilos para las tablas-->
    <link href="Estilos/dataTables.min.css" rel="stylesheet" />
    <link href="Estilos/dataTables.bootstrap4.min.css" rel="stylesheet" />
</head>
<style>
    #tblDetalleFacturas_length > label > select {
        width: 60px;
    }
</style>
<body class="hold-transition sidebar-mini">
    <section class="content">
        <div class="container-fluid">
            <div class="row">
                <!-- left column -->
                <div class="col-md-12" id="dvMenu">
                </div>
                <div class="col-md-12">
                    <div class="card card-primary">
                        <div class="card-header">
                            <h3 class="card-title">GESTIÓN DETALLE FACTURAS</h3>
                        </div>
                        <form id="frmIncapacidades">
                            <div class="card-body">
                                <div class="card card-gray-dark">
                                    <div class="card-header">
                                        <h3 class="card-title">DATOS ENTRADA</h3>
                                    </div>
                                    <div class="card-body">





                                        <div class="row">

                                            <!-- CAMPO OCULTO PARA ID_VENTA -->
                                            <!-- <input type="hidden" id="txtID_Venta" /> -->

                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtID_Detalle_Factura">Código Detalle Factura</label>
                                                    <input type="text" class="form-control" id="txtID_Detalle_Factura" placeholder="ID del detalle de factura">
                                                </div>
                                            </div>

                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtID_Factura">Código Factura</label>
                                                    <input type="text" class="form-control" id="txtID_Factura" placeholder="ID de la factura asociada">
                                                </div>
                                            </div>

                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtTipo_Item">Tipo de Ítem</label>
                                                    <input type="text" class="form-control" id="txtTipo_Item" placeholder="Ej: Servicio, Producto">
                                                </div>
                                            </div>

                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtID_Detalle_Servicio_Factura">Código Detalle Servicio</label>
                                                    <input type="text" class="form-control" id="txtID_Detalle_Servicio_Factura" placeholder="ID del detalle de servicio">
                                                </div>
                                            </div>

                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtDescripcion_Item">Descripción del Ítem</label>
                                                    <input type="text" class="form-control" id="txtDescripcion_Item" placeholder="Descripción del servicio o producto">
                                                </div>
                                            </div>

                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtCantidad">Cantidad</label>
                                                    <input type="number" class="form-control" id="txtCantidad" placeholder="Cantidad" step="0.01">
                                                </div>
                                            </div>

                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtPrecio_Unitario">Precio Unitario</label>
                                                    <input type="number" class="form-control" id="txtPrecio_Unitario" placeholder="Precio por unidad" step="0.01">
                                                </div>
                                            </div>

                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtSubtotal_Item">Subtotal del Ítem</label>
                                                    <input type="number" class="form-control" id="txtSubtotal_Item" placeholder="Subtotal" step="0.01">
                                                </div>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                                <div class="card card-danger">
                                    <div class="card-header">
                                        <h3 class="card-title">PROCESO</h3>
                                    </div>
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-md-3">
                                                <br />
                                                <button type="button" id="btnInsertar" class="btn-block btn-lg btn-primary" onclick="EjecutarComando('POST', 'Insertar')">INSERTAR</button>
                                            </div>
                                            <div class="col-md-3">
                                                <br />
                                                <button type="button" id="btnActualizar" class="btn-block btn-lg btn-primary" onclick="EjecutarComando('PUT', 'Actualizar')">ACTUALIZAR</button>
                                            </div>
                                            <div class="col-md-3">
                                                <br />
                                                <button type="button" id="btnEliminar" class="btn-block btn-lg btn-primary" onclick="EjecutarComando('DELETE', 'Eliminar')">ELIMINAR</button>
                                            </div>
                                            <div class="col-md-3">
                                                <br />
                                                <button type="button" id="btnConsultar" class="btn-block btn-lg btn-primary" onclick="Consultar()">CONSULTAR</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-12">
                                            <table id="tblDetalleFacturas" class="table table-bordered table-striped" style="width:100%;">
                                                <thead>
                                                    <tr>
                                                        <th>ID_Detalle_Factura</th>
                                                        <th>ID_Factura</th>
                                                        <th>Tipo_Item</th>
                                                        <th>ID_Detalle_Servicio_Factura</th>
                                                        <th>ID_Detalle_Repuesto_Factura</th>
                                                        <th>Descripcion_Item</th>
                                                        <th>Cantidad</th>
                                                        <th>Precio_Unitario</th>
                                                        <th>Subtotal_Item</th>
                                                        <th>Detalle_Repuestos_Orden</th>
                                                        <th>Detalle_Servicio</th>
                                                        <th>Factura</th>
                                                    </tr>
                                                </thead>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="card-footer">
                                <div id="dvMensaje" class=""></div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="../Scripts/jquery-3.4.1.min.js"></script>
    <script src="../Scripts/bootstrap.bundle.min.js"></script>
    <!--Tables-->
    <script src="../Scripts/jquery.dataTables.min.js"></script>
    <script src="../Scripts/dataTables.bootstrap4.min.js"></script>
    <script src="Scripts/Comunes/Comunes.js"></script>
    <script src="Scripts/Comunes/CRUD.js"></script>
    <script src="Scripts/DetalleFactura.js"></script>
</body>
</html>
